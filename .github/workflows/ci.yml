name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS deps
        run: pnpm -C apps/web install --frozen-lockfile

      - name: Web typecheck + lint
        run: |
          pnpm -C apps/web typecheck
          pnpm -C apps/web lint

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"

      - name: Install Python deps
        run: uv sync --all-packages --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

  unit-tests:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - run: uv run pytest -m "not integration" -q

  integration-tests:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_DB: aleph
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: changeme-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://aleph:changeme-ci@localhost:5432/aleph
      REDIS_URL: redis://localhost:6379/0
      LANGFUSE_HOST: http://localhost:3000
      LANGFUSE_PUBLIC_KEY: pk-ci
      LANGFUSE_SECRET_KEY: sk-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LITELLM_BASE_URL: http://localhost:18999
      INSIGHTS_LITELLM_API_KEY: ci-fake
      ALEPH_AUTH_ISSUER: http://localhost:8080/realms/aleph
      ALEPH_AUTH_AUDIENCE: aleph
      ALEPH_AUTH_JWKS_URL: http://localhost:8080/jwks
      ALEPH_AGENT_TOKEN_SECRET: ci-agent-token-secret-do-not-use-elsewhere
      ALEPH_DEFAULT_MODEL_PROFILE: aleph-dev
      ALEPH_ENV: local  # Settings.aleph_env ∈ {local,dev,staging,prod}; "ci" is rejected
      # MinIO/asset store — the ingest-url + upload routes 422 ("asset store is
      # not configured") unless the lifespan can build an AssetStore. Started as
      # a `docker run` step below (GH `services:` can't pass MinIO's `server`
      # command). The `aleph-local` bucket is auto-created by AssetStore on first use.
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: aleph
      MINIO_ROOT_PASSWORD: changeme-ci
      ALEPH_S3_BUCKET: aleph-local
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=aleph -e MINIO_ROOT_PASSWORD=changeme-ci \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then echo "minio up"; exit 0; fi
            sleep 2
          done
          echo "minio did not become healthy" >&2
          docker logs minio || true
          exit 1
      - name: Run Alembic migrations
        run: cd apps/api && uv run alembic upgrade head
      - name: Alembic check (no drift vs models)
        run: cd apps/api && uv run alembic check
      - name: Integration tests
        run: uv run pytest -m integration -q

  evals:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - run: uv run python -m aleph_evals --datasets all --gate strict

  build-web:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
