name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS deps
        run: pnpm -C apps/web install --frozen-lockfile

      - name: Web typecheck + lint
        run: |
          pnpm -C apps/web typecheck
          pnpm -C apps/web lint

      # The runtime bridge was never typechecked or lockfile-pinned; its
      # manifest floated and the deployed container ran versions the manifest
      # did not describe. `npm ci` fails on lockfile drift, `tsc` fails on API
      # drift between the pinned @ag-ui/client and @copilotkit/runtime.
      - name: Copilot-runtime install + typecheck
        run: |
          npm --prefix apps/copilot-runtime ci
          npm --prefix apps/copilot-runtime run typecheck

      - name: No self-fetch in A2UI surface components (WP-4a)
        run: ./scripts/check-no-self-fetch.sh

      - name: A2UI catalog producer/renderer sweep (WP-4e)
        run: ./scripts/check-catalog-roster.sh

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"

      - name: Install Python deps
        run: uv sync --all-packages --all-extras

      - name: Route reachability sweep (WP-5)
        run: ./scripts/check-route-reachability.sh

      - name: Docs drift guard (WP-7)
        run: ./scripts/check-docs-drift.sh

      - name: CLAUDE.md command executability guard (WP-7)
        run: ./scripts/check-claude-commands.sh

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

  unit-tests:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - run: uv run pytest -m "not integration" -q

  integration-tests:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_DB: aleph
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: changeme-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://aleph:changeme-ci@localhost:5432/aleph
      REDIS_URL: redis://localhost:6379/0
      LANGFUSE_HOST: http://localhost:3000
      LANGFUSE_PUBLIC_KEY: pk-ci
      LANGFUSE_SECRET_KEY: sk-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LITELLM_BASE_URL: http://localhost:18999
      INSIGHTS_LITELLM_API_KEY: ci-fake
      ALEPH_AUTH_ISSUER: http://localhost:8080/realms/aleph
      ALEPH_AUTH_AUDIENCE: aleph
      ALEPH_AUTH_JWKS_URL: http://localhost:8080/jwks
      ALEPH_AGENT_TOKEN_SECRET: ci-agent-token-secret-do-not-use-elsewhere
      ALEPH_DEFAULT_MODEL_PROFILE: aleph-dev
      ALEPH_ENV: local  # Settings.aleph_env ∈ {local,dev,staging,prod}; "ci" is rejected
      # Asset store — fs backend (the default), rooted in the runner workspace.
      # No MinIO service: WP-1 removed it from the default stack.
      ALEPH_ASSET_BACKEND: fs
      ALEPH_ASSET_ROOT: ${{ github.workspace }}/data/assets
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - name: Run Alembic migrations
        run: cd apps/api && uv run alembic upgrade head
      - name: Alembic check (no drift vs models)
        run: cd apps/api && uv run alembic check
      - name: Integration tests
        run: uv run pytest -m integration -q

  # Browser regression coverage for the workspace chrome. `apps/web` has no unit
  # test runner, and `tsc` cannot see a CSS class or a mis-wired component — so
  # before this job the entire frontend was verified only by hand.
  #
  # Runs the `@shell` subset: the specs that need Postgres + Redis + the API +
  # the built web app, and NOT the LLM gateway or the copilot-runtime. The rest
  # of the suite (ingest → wiki → research) needs both and stays manual.
  # Verified locally against this exact stack: 10/10 passing.
  playwright-shell:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_DB: aleph
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: changeme-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://aleph:changeme-ci@localhost:5432/aleph
      REDIS_URL: redis://localhost:6379/0
      LITELLM_BASE_URL: http://localhost:18999
      INSIGHTS_LITELLM_API_KEY: ci-fake
      LANGFUSE_HOST: http://localhost:3000
      LANGFUSE_PUBLIC_KEY: pk-ci
      LANGFUSE_SECRET_KEY: sk-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      ALEPH_AGENT_TOKEN_SECRET: ci-agent-token-secret-do-not-use-elsewhere
      ALEPH_DEFAULT_MODEL_PROFILE: aleph-dev
      ALEPH_ENV: local
      ALEPH_AUTH_MODE: local
      ALEPH_ASSET_BACKEND: fs
      ALEPH_ASSET_ROOT: ${{ github.workspace }}/data/assets
      # The web bundle calls http://localhost:8000 and the API's CORS allow-list
      # is exactly http://localhost:5173 — the origins must match or every
      # in-page fetch is blocked and the shell renders with no data.
      ALEPH_WEB_BASE_URL: http://localhost:5173
      ALEPH_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --all-packages --all-extras
      - name: Migrate
        run: cd apps/api && uv run alembic upgrade head
      - name: Start API
        run: |
          uv run uvicorn aleph_api.main:create_app --factory --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "API did not become healthy"; exit 1
      - name: Build + serve web
        run: |
          pnpm -C apps/web install --frozen-lockfile
          pnpm -C apps/web build
          pnpm -C apps/web preview --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ >/dev/null && exit 0
            sleep 2
          done
          echo "web did not come up"; exit 1
      - name: Playwright (@shell)
        run: |
          cd tests/playwright
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --grep "@shell" --grep-invert "@runtime"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright/playwright-report
          retention-days: 7

  evals:
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.21"
      - run: uv sync --all-packages --all-extras
      - run: uv run python -m aleph_evals --datasets all --gate strict

  build-web:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
