name: CI

# Every job here must genuinely be able to fail. If a check cannot fail on a
# real regression it does not belong in this file — a green light that means
# nothing is worse than no light, and that is exactly how the previous eval
# gate hid a broken retrieval path for seven work packages.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  python-quality:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict, 0 errors)
        run: uv run pyright

  python-unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run pytest -m "not integration" -q

  python-integration:
    name: integration tests · migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: aleph
          POSTGRES_DB: aleph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ALEPH_DATABASE_URL: postgresql+asyncpg://aleph:aleph@localhost:5432/aleph
      ALEPH_REDIS_URL: redis://localhost:6379/0
      ALEPH_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: alembic check (no model drift)
        working-directory: apps/api
        run: uv run alembic check
      - run: uv run pytest -m integration -q

  web:
    name: web typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web build
