name: CI

# Every job here must genuinely be able to fail. If a check cannot fail on a
# real regression it does not belong in this file — a green light that means
# nothing is worse than no light, and that is exactly how the previous eval
# gate hid a broken retrieval path for seven work packages.
#
# The two `scripts/check-*.sh` steps below are kept under that same rule, not
# grandfathered past it: both regenerate an artifact from its source and diff,
# so each has a concrete, reproducible failing input. The five sweeps deleted
# with the old gate did not.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  python-quality:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright (strict, 0 errors)
        run: uv run pyright

      # `catalog.json` is the only catalog a human edits; `apps/web/src/a2ui/
      # catalog.ts` and `apps/copilot-runtime/src/catalog.generated.ts` are
      # written by `scripts/gen_catalog.py`. Fails on a hand-edit to either
      # generated file, or on a `catalog.json` change committed without
      # re-running the generator — the drift that let the agent-facing catalog
      # offer a confidence value nothing recognised.
      - name: A2UI generated catalogs match catalog.json
        run: ./scripts/check-catalog-generated.sh

      # LangGraph silently discards node writes to channels its state TypedDict
      # does not declare: the reader gets an empty default and reports success.
      # Four shipped defects had that shape. The analyzer is the one in
      # tests/unit/test_graph_state_keys.py — imported, not copied, so the two
      # entry points cannot disagree; this is the fast named gate for it.
      - name: LangGraph state-key sweep
        run: ./scripts/check-graph-state-keys.sh

      # Two modules each declared `ALEPH_V09_CATALOG_ID = "aleph://v1"` and each
      # built its own catalog under that one id, disagreeing about whether the
      # basic-catalog functions were included. A surface binding `formatDate`
      # rendered in a pane and threw in chat — same id, two behaviours, no build
      # error. Asserts one declaration, one constructor, functions still passed.
      - name: One A2UI catalog, one identity
        run: ./scripts/check-single-catalog.sh

      # The server accepted seven pane kinds while the client type admitted
      # five, so `artifacts` and `grounding` could be streamed and had nowhere
      # to land — GroundingSurface shipped complete on every layer and no code
      # could open it. The server drops unknown tabs rather than raising (so one
      # bad pane in a URL cannot kill the stream), which is exactly why neither
      # side could notice. Compares the two registries directly.
      - name: Pane registry agrees, client and server
        run: ./scripts/check-pane-registry.sh

      # The A2UI binder resolves only the props a component's zod schema
      # declares. A producer that binds one the client never declares has it
      # dropped in silence: the SSE payload is correct, the view reads
      # `undefined`, and nothing raises. The wiki surface shipped ten
      # categories and a health summary this way and rendered as though the
      # project had no categories at all — both halves looked right alone.
      - name: Surface props the client actually binds
        run: ./scripts/check-surface-bindings.sh

      # CLAUDE.md's "Fixed, with the test that pins each" section is what stops a
      # fixed bug from silently un-fixing — and four of its pins named test files
      # deleted in the harness reset, `pnpm-workspace.yaml` declared a member
      # directory that was gone, and a dangling symlink under audit/ made six
      # e2e checks SKIP forever while the runner reported no failures. A citation
      # that names nothing reads as evidence and is an assertion.
      - name: Every path named in prose or in a gate resolves
        run: ./scripts/check-dead-refs.sh

      # `docs/acceptance.md` is the scoreboard, and it drifted into the failure
      # it exists to catch: A1 claimed 49 tests against a suite of 142, D4
      # claimed an integration test asserting database rows against thirteen
      # pure in-memory unit tests. This cannot check what a test asserts —
      # nothing can — but it stops a ✅ row citing a test id pytest cannot find.
      - name: Every ✅ acceptance row names a test that exists
        run: ./scripts/check-acceptance-claims.sh

      # The assistant could rewrite its own standing orders on the live
      # container, silently, using its ordinary file-writing tools — and text in
      # an ingested web page could in principle tell it to. This checks the
      # EFFECTIVE permission decision, not the presence of a keyword argument:
      # matching is first-match-wins, so an allow ahead of the deny reopens
      # everything while `grep -c permissions=` stays happily at 1.
      - name: The agent cannot rewrite its own skills
        run: ./scripts/check-agent-fs-permissions.sh

      # Any one of 27 tools raising used to end the conversation: LangChain's
      # ToolNode re-raises anything that is not a schema-validation error. The
      # guard's whole value is coverage, and deepagents lets a subagent spec
      # REPLACE the parent's middleware rather than extend it — so "the
      # orchestrator has it" is not "the subagents have it".
      - name: Every agent and subagent survives a raising tool
        run: ./scripts/check-agent-middleware.sh

      # `commit_revision` picks a version number as `max + 1`, which is only
      # safe while the page row is locked FOR UPDATE. It was not, on the branch
      # five call sites take, so two concurrent commits both read the same max
      # and the loser's work was discarded as an unhandled 500.
      - name: No unlocked wiki page read in the create-or-lock path
        run: ./scripts/check-page-lock.sh

      # The wiki schema doc claimed 13 lint checks against 16 in the code, so a
      # reader counting on the doc was told the wiki was less governed than it
      # is. A number in prose beside a number in code is a number that drifts.
      - name: The documented lint count matches the code
        run: ./scripts/check-lint-count.sh

      # The bridge on :4000 drives the agent with no authentication of its own.
      # It ran `cors: true` — every origin, with credentials — published on
      # every interface, so any page the user had open could drive their
      # assistant.
      - name: The runtime bridge is not an any-origin, any-host proxy
        run: ./scripts/check-runtime-bridge.sh

      # These four were written in the same change and wired into NOTHING —
      # not acceptance, not CI, not the self-check. A sweep with no consumer is
      # the defect class this repo names as dominant, and it is worse in a
      # sweep than in product code: the sweep is what was meant to catch it.
      - name: Every web module is reachable from an entry point
        run: ./scripts/check-web-dead-code.sh

      - name: No unused class selector in the stylesheets
        run: ./scripts/check-web-dead-css.sh

      - name: Design-token drift does not grow
        run: ./scripts/check-web-drift.sh

      # Compose hardening: restart policies, log rotation, memory caps, the
      # gateway URL being interpolatable, and no image running as root.
      - name: The compose stack is hardened
        run: ./scripts/check-compose-hardening.sh

      # WS-A3a: the agent-facing catalog is derived from the renderer, so the
      # two cannot drift. Unwired when it landed — and its own reviewer proved
      # the drift it exists to stop can be reintroduced with every OTHER gate
      # still green.
      - name: The agent is told about everything the browser can draw
        run: ./scripts/check-agent-catalog-covers-renderer.sh

      # WS-RS9: one confidence vocabulary across the enum, the database and the
      # renderer.
      - name: One confidence vocabulary
        run: ./scripts/check-confidence-vocabulary.sh

      # WS-P6: every project-scoped route handler takes ProjectScopeDep.
      - name: Project scope is not optional on a project route
        run: ./scripts/check-project-scope.sh

      # Every sweep has a consumer. Three landed unwired in three consecutive
      # batches — see the script for why this is the fix rather than wiring
      # them one at a time.
      - name: Every sweep is actually run by something
        run: ./scripts/check-sweeps-are-wired.sh
      - name: Tracked code does not import untracked modules
        run: ./scripts/check-imports-resolve.sh

  images:
    name: images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nothing built these. `grep -n "docker\|Dockerfile" ci.yml` returned
      # ZERO lines against five Dockerfiles, so a change that broke an image
      # was found by whoever next ran `compose up` — which, for the digest-pin
      # and non-root work, would have been at deploy time.
      #
      # Build only; no push, no registry. The question is whether the
      # instructions still produce an image, and `--load` keeps that answerable
      # without any credentials.
      - name: Build every image
        run: |
          set -euo pipefail
          for df in apps/api/Dockerfile \
                    apps/workers/Dockerfile \
                    apps/code-runner/Dockerfile \
                    apps/copilot-runtime/Dockerfile \
                    apps/web/Dockerfile \
                    apps/web/Dockerfile.dev; do
            echo "::group::$df"
            docker build -f "$df" -t "aleph-ci:$(echo "$df" | tr /. -)" .
            echo "::endgroup::"
          done

      # A `USER` line that names a uid the image cannot actually run as is worse
      # than no `USER` line: the sweep goes green and the container still fails,
      # now at deploy time with a permissions error nobody expects.
      - name: Every built image runs as a non-root uid
        run: |
          set -euo pipefail
          for df in apps/api/Dockerfile \
                    apps/workers/Dockerfile \
                    apps/code-runner/Dockerfile \
                    apps/copilot-runtime/Dockerfile \
                    apps/web/Dockerfile.dev; do
            tag="aleph-ci:$(echo "$df" | tr /. -)"
            uid=$(docker run --rm --entrypoint sh "$tag" -c 'id -u')
            echo "$df -> uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$df runs as root"; exit 1; }
          done

  python-unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run pytest -m "not integration" -q

  python-integration:
    name: integration tests · migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: aleph
          POSTGRES_DB: aleph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # DATABASE_URL / REDIS_URL, not ALEPH_-prefixed: `alembic/env.py` reads
      # `DATABASE_URL` and raises without it, and both settings models declare
      # these fields unprefixed. The ALEPH_-prefixed spelling meant every step
      # below failed before a single test was collected — this job had not run
      # since it was introduced.
      DATABASE_URL: postgresql+asyncpg://aleph:aleph@localhost:5432/aleph
      REDIS_URL: redis://localhost:6379/0
      ALEPH_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: alembic check (no model drift)
        working-directory: apps/api
        run: uv run alembic check

      # 26 revisions, every one with a `downgrade()` body, and not one had ever
      # been executed: `grep -rn downgrade .github/ scripts/ tests/` returned
      # nothing. CI enforced `alembic check` for the FORWARD path, so the reverse
      # path was entirely unguarded — 26 functions written correctly and read by
      # nothing. Runs against a scratch database it creates and drops, because
      # downgrading the dev database would destroy the corpus and a check nobody
      # dares run is not a check.
      - name: migration round trip (downgrade actually runs)
        run: ./scripts/check-migration-roundtrip.sh

      - run: uv run pytest -m integration -q

      # The retrieval number, re-measured, where it can be seen to move.
      #
      # Aleph's headline research claim is a measured number and NOTHING ever
      # re-checked it: `grep -c aleph_evals ci.yml` returned 0. Every quality
      # claim in RS5/RS6/RS7/RS10 is a claim about this number, and there was no
      # mechanism that would have caught any of them regressing.
      #
      # LEXICAL-ONLY, and deliberately so. CI has no model gateway by design
      # ("Aleph serves no models"), and the lexical leg needs none — so this
      # measures the half that can be measured here rather than skipping, which
      # is how a check stops running. The floor is set against the lexical
      # baseline, not the hybrid one; the eval prints which mode it ran in, so a
      # run that quietly lost its dense leg cannot be mistaken for a good one.
      - name: retrieval eval (lexical leg, with a floor that can fail)
        run: uv run python -m aleph_evals.retrieval_eval --min-recall 0.55

      # And the dataset runner, which must refuse to report success on nothing.
      # It printed `selected_datasets: []` and exited 0.
      - name: the eval runner refuses to pass on an empty selection
        run: |
          if uv run python -m aleph_evals --datasets-root /nonexistent; then
            echo "::error::the eval runner exited 0 having evaluated nothing"
            exit 1
          fi

  acceptance:
    name: acceptance gate · self-check
    runs-on: ubuntu-latest
    # The gate CLAUDE.md calls "the gate to trust", finally running where it can
    # be seen. It had never been invoked by CI at all: `grep -c acceptance.sh
    # ci.yml` returned 0 while `docs/acceptance.md` reported 38 of 41 parts done.
    #
    # `--strict` because services ARE guaranteed here, so "cannot run on this
    # machine" is not true on this machine — a SKIP in CI is a check that has
    # quietly stopped running.
    #
    # `--self-check` because a check nobody has seen fail is an assumption
    # wearing a green light. It mutates each subject and requires the check to
    # notice.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aleph
          POSTGRES_PASSWORD: aleph
          POSTGRES_DB: aleph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aleph"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Nine settings on `Settings` have no default, so a process that boots the
      # real app raises pydantic ValidationError without them. `kernel_boot.py`
      # and `worker_boot.py` are exactly that, which is why they could never
      # have run in the existing integration job.
      DATABASE_URL: postgresql+asyncpg://aleph:aleph@localhost:5432/aleph
      REDIS_URL: redis://localhost:6379/0
      ALEPH_TEST_DATABASE_URL: postgresql+asyncpg://aleph:aleph@localhost:5432/aleph
      ALEPH_TEST_REDIS_URL: redis://localhost:6379/0
      ALEPH_AUTH_MODE: local
      # No gateway is reachable from CI, and that is fine: the checks that need
      # one detect it and SKIP. A placeholder URL that resolves to nothing is
      # more honest than a real one nobody can reach.
      LITELLM_BASE_URL: http://127.0.0.1:1
      INSIGHTS_LITELLM_API_KEY: ci-not-a-real-key
      # Tracing is opt-in and stays off: an empty OTLP endpoint is the documented
      # way to skip the exporter (aleph_observability/tracing.py:56-68).
      LANGFUSE_HOST: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      ALEPH_API_INTERNAL_URL: http://127.0.0.1:8000
      ALEPH_AGENT_TOKEN_SECRET: ci-only-secret-not-used-outside-this-job-32b
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head

      # One pass: run every check AND prove the checks can fail.
      #
      # The skip budget only ever ratchets DOWN. Raising it is a decision that
      # has to be argued for in a diff; leaving it uncapped is how "unrunnable
      # here" became the place features went to hide.
      - name: acceptance gate · self-check
        run: ./scripts/acceptance.sh --self-check --max-skip 6

      # The eight numbers, printed on every build. This does not gate — several
      # of them are not measurable yet and say so — but a number nobody looks at
      # is a number that drifts.
      - name: the eight numbers
        run: ./scripts/status.sh || true

  web:
    name: web typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web build

      # The copilot-runtime bridge is a separate npm project, and it was never
      # typechecked or lockfile-pinned: its manifest floated and the deployed
      # container ran versions the manifest did not describe. `npm ci` fails on
      # lockfile drift; `tsc` fails on API drift between the pinned
      # @ag-ui/client and @copilotkit/runtime — and on a generated
      # `catalog.generated.ts` that no longer compiles against server.ts.
      - name: copilot-runtime install + typecheck
        run: |

      # WS-P4 stood up vitest and 89 tests, and CI ran none of them. Every
      # workstream wanting a behavioural front-end assertion had been settling
      # for a source-level grep because no runner existed; a runner that exists
      # and does not run is the same outcome with more files in it.
      - name: web unit tests
        run: pnpm -C apps/web test:run
          npm --prefix apps/copilot-runtime ci
          npm --prefix apps/copilot-runtime run typecheck
