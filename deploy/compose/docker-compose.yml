# Aleph — local stack.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then set your model endpoint
#   docker compose -f deploy/compose/docker-compose.yml up -d --wait
#
# `--wait` is meaningful here: every service declares a readiness healthcheck,
# so the command returns when the stack can actually serve, not when the
# processes have started.
#
# There is no `version:` key. It has been obsolete since Compose v2 and current
# Docker warns about it.
#
# WHAT THIS DOES NOT DO: serve models. Aleph connects out to whatever
# OpenAI-compatible endpoint you point it at — see §1 of .env.example. Nothing
# in this file starts an inference server, and nothing should.

name: aleph

# --- shared fragments --------------------------------------------------------

# Reaching the operator's model endpoint. `host.docker.internal` resolves on
# macOS and Windows natively; `host-gateway` is what makes the identical string
# work on Linux, so one .env line is correct on every machine.
x-model-access: &model-access
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-app-env: &app-env
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://aleph:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aleph
    REDIS_URL: redis://redis:6379/0

x-depends-on-data: &depends-on-data
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

networks:
  aleph:
  # Agent-written code runs here. `internal` means no route off the host at
  # all — the runner can reach the queue and nothing else, including the API,
  # the model endpoint, and the internet.
  runner:
    internal: true

volumes:
  postgres-data:
  redis-data:
  assets:
  clickhouse-data:
  minio-data:

services:
  # --- data ------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg17
    networks: [aleph]
    environment:
      POSTGRES_USER: aleph
      POSTGRES_DB: aleph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      # -U/-d because the default `pg_isready` probes the `postgres` role,
      # which does not exist here and would report healthy against a database
      # the app cannot use.
      test: ["CMD-SHELL", "pg_isready -U aleph -d aleph"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Both networks: the queue is the one thing code-runner is allowed to see.
    networks: [aleph, runner]
    volumes:
      - redis-data:/data
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  # --- schema ----------------------------------------------------------------

  # One-shot. Every service that touches the database waits for this to exit 0,
  # so no app ever runs against a half-migrated schema.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    networks: [aleph]
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/apps/api
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"

  # --- application -----------------------------------------------------------

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    networks: [aleph]
    <<: [*app-env, *model-access]
    depends_on:
      <<: *depends-on-data
      migrate:
        condition: service_completed_successfully
    volumes:
      - assets:/app/data/assets
    ports: ["${API_PORT_HOST:-8000}:8000"]
    healthcheck:
      # /readyz, not /healthz: it round-trips the database, the queue and the
      # asset store. Liveness would report healthy while every request failed.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
      start_interval: 2s
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/api/src
          target: /app/apps/api/src
        - action: rebuild
          path: ../../apps/api/pyproject.toml

  workers:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    networks: [aleph]
    <<: [*app-env, *model-access]
    depends_on:
      <<: *depends-on-data
      migrate:
        condition: service_completed_successfully
    volumes:
      - assets:/app/data/assets
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f aleph_workers.arq > /dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/workers/src
          target: /app/apps/workers/src

  code-runner:
    build:
      context: ../..
      dockerfile: apps/code-runner/Dockerfile
    # `runner` ONLY. No aleph network, so agent-written code cannot reach the
    # API, the database, the model endpoint or the internet — only the queue.
    networks: [runner]
    environment:
      REDIS_URL: redis://redis:6379/0
      CODE_RUNNER_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # Deliberately NOT given .env: this container must hold no credentials.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # mem_limit + memswap_limit set equal is the only way to say "no swap";
    # `deploy.resources` cannot express it. Removing the swap cap previously let
    # a runaway render take the host down.
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f aleph_code_runner.arq > /dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  copilot-runtime:
    build:
      context: ../..
      dockerfile: apps/copilot-runtime/Dockerfile
    networks: [aleph]
    environment:
      AGENT_URL: http://api:8000/copilotkit/agent/assistant
      PORT: "4000"
    depends_on:
      api:
        condition: service_healthy
    ports: ["${RUNTIME_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 25s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    networks: [aleph]
    environment:
      VITE_API_URL: ${ALEPH_SELF_URL:-http://localhost:8000}
      VITE_RUNTIME_URL: http://localhost:4000
      VITE_AUTH_MODE: ${ALEPH_AUTH_MODE:-local}
    depends_on:
      api:
        condition: service_healthy
    ports: ["${WEB_PORT:-5173}:5173"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 25s
    develop:
      watch:
        - action: sync
          path: ../../apps/web/src
          target: /app/apps/web/src
        - action: rebuild
          path: ../../apps/web/package.json

  # --- tracing (opt-in: --profile tracing) -----------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [tracing]
    networks: [aleph]
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CLICKHOUSE_DB: langfuse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse:
    image: langfuse/langfuse:3
    profiles: [tracing]
    networks: [aleph]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aleph:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${ALEPH_AGENT_TOKEN_SECRET:?set ALEPH_AGENT_TOKEN_SECRET in .env}
      SALT: ${ALEPH_AGENT_TOKEN_SECRET}
      ENCRYPTION_KEY: ${ALEPH_AGENT_TOKEN_SECRET}
    ports: ["${LANGFUSE_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [tracing]
    networks: [aleph]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports: ["4317:4317"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # --- object store (opt-in: --profile s3) -----------------------------------

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [s3]
    networks: [aleph]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ALEPH_S3_ACCESS_KEY:-aleph}
      MINIO_ROOT_PASSWORD: ${ALEPH_S3_SECRET_KEY:?set ALEPH_S3_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
