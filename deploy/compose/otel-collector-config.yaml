receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: insert

exporters:
  # NOTE: Langfuse v2 (the pinned image) has no OTLP ingestion endpoint — that
  # arrived in Langfuse v3 — so POSTs to /api/public/otel/v1/traces 404 and the
  # collector drops every batch with a noisy error. The app already sends its
  # Langfuse traces via the Langfuse SDK directly (LANGFUSE_HOST), so this
  # exporter is redundant here and is left OUT of the traces pipeline below.
  # Re-add it to the pipeline once Langfuse is upgraded to v3+.
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_HOST}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"
    encoding: proto
  # Mirror to stdout for local debugging.
  debug:
    verbosity: basic
    sampling_initial: 5

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
