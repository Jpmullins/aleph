# OpenTelemetry collector — only runs under `--profile tracing`.
#
# Receives OTLP from the API and the workers and forwards spans to Langfuse's
# OTLP endpoint. Keeping a collector in the middle (rather than exporting from
# the app directly) means swapping the tracing backend is a change to this file
# and nothing else.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before the collector becomes the reason the host falls over.
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse:3000/api/public/otel
    headers:
      # Langfuse authenticates OTLP with the same project keys the SDK uses.
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC_AUTH}"
  # Always on: if Langfuse is unreachable, traces are still visible in
  # `docker compose logs otel-collector` instead of vanishing silently.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse, debug]
