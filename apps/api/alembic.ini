[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
output_encoding = utf-8
sqlalchemy.url =

[post_write_hooks]
# `exec`, not `console_scripts`: ruff is distributed as a compiled binary and
# declares no entry points, so `console_scripts` could never resolve it — every
# `alembic revision --autogenerate` ended in
# "Could not find entrypoint console_scripts.ruff" AFTER writing the file, so
# the migration existed but the command exited non-zero.
# Format runs after fix so the result matches `ruff format --check`, which CI
# runs over the whole tree including these files.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
