[project]
name = "aleph-api"
version = "0.1.0"
description = "Aleph FastAPI app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "orjson==3.11.9",
    "redis>=5,<6",
    "python-multipart==0.0.31",
    "alembic==1.18.4",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    # harness_profiles.py reads an operator-supplied YAML profile file. It
    # resolved transitively via aleph-wiki; JSON works without it, which is
    # exactly why the missing declaration would not have been noticed.
    "pyyaml>=6,<7",
    # CopilotKit + AG-UI coagent runtime (Wave 2). ChatOpenAI is pointed at
    # the Insights gateway only — see CLAUDE.md rule #2.
    "copilotkit>=0.1.91",
    "ag-ui-langgraph>=0.0.36",
    # >=0.6.8 is langchain-quickjs 0.2.0's floor, not a preference; the <0.7
    # ceiling is unchanged because 0.7 moves deepagents' middleware API and
    # langchain-quickjs 0.2/0.3 both refuse it.
    "deepagents>=0.6.8,<0.7",
    # The agent's QuickJS scratchpad (WS-H5). Pulls quickjs-rs, which ships
    # cp313 wheels for macOS arm64 and manylinux — no toolchain needed in
    # the API image.
    "langchain-quickjs~=0.2.0",
    "langgraph>=1.2,<2",
    # Postgres-backed langgraph store for cross-session Deep Agent memory (Wave 6 D1).
    # Provides langgraph.store.postgres.AsyncPostgresStore; pulls psycopg (sync+async).
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2",
    "langchain-openai>=1",
    "aleph-runtime",
    "aleph-core",
    "aleph-db",
    "aleph-security",
    "aleph-observability",
    "aleph-models",
    "aleph-evals",
    "aleph-research",
    "aleph-rks",
    "aleph-scholar",
    "aleph-wiki",
    "aleph-assistant",
    "aleph-connectors",
    "aleph-a2ui",
    "aleph-notes",
    "aleph-reviewer",
    "aleph-artifacts",
]

[project.scripts]
aleph-api = "aleph_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_api"]
