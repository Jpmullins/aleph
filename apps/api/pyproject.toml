[project]
name = "aleph-api"
version = "0.1.0"
description = "Aleph FastAPI app"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "orjson==3.11.9",
    "redis>=5,<6",
    "python-multipart==0.0.31",
    "alembic==1.18.4",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    # CopilotKit + AG-UI coagent runtime (Wave 2). ChatOpenAI is pointed at
    # the Insights gateway only — see CLAUDE.md rule #2.
    "copilotkit>=0.1.91",
    "ag-ui-langgraph>=0.0.36",
    "deepagents>=0.6",
    "langgraph>=1.2,<2",
    # Postgres-backed langgraph store for cross-session Deep Agent memory (Wave 6 D1).
    # Provides langgraph.store.postgres.AsyncPostgresStore; pulls psycopg (sync+async).
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2",
    "langchain-openai>=1",
    "aleph-core",
    "aleph-db",
    "aleph-security",
    "aleph-observability",
    "aleph-models",
    "aleph-evals",
    "aleph-research",
    "aleph-rks",
    "aleph-scholar",
    "aleph-wiki",
    "aleph-assistant",
    "aleph-connectors",
    "aleph-a2ui",
    "aleph-notes",
    "aleph-reviewer",
    "aleph-hypotheses",
    "aleph-datasets",
    "aleph-artifacts",
]

[project.scripts]
aleph-api = "aleph_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_api"]
