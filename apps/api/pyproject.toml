[project]
name = "aleph-api"
version = "0.1.0"
description = "Aleph FastAPI app"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "orjson==3.11.9",
    "redis==7.4.0",
    "python-multipart==0.0.29",
    "alembic==1.18.4",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "aleph-core",
    "aleph-db",
    "aleph-security",
    "aleph-observability",
    "aleph-models",
    "aleph-evals",
    "aleph-rks",
    "aleph-wiki",
    "aleph-assistant",
    "aleph-connectors",
    "aleph-aiq",
    "aleph-a2ui",
    "aleph-notes",
    "aleph-reviewer",
    "aleph-hypotheses",
]

[project.scripts]
aleph-api = "aleph_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_api"]
