[project]
name = "aleph-workers"
version = "0.1.0"
description = "Aleph Arq workers"
requires-python = ">=3.13"
dependencies = [
    "arq==0.28.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "redis==7.4.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "structlog==25.5.0",
    "aleph-core",
    "aleph-db",
    "aleph-security",
    "aleph-observability",
    "aleph-models",
    "aleph-rks",
    "aleph-wiki",
    "aleph-assistant",
    "aleph-reviewer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_workers"]
