<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%231e293b'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Inter, sans-serif' font-size='42' font-weight='700' fill='%23f8fafc'%3EA%3C/text%3E%3C/svg%3E" />
    <title>Aleph</title>
    <script>
      // Resolve the stored theme preference to an explicit data-theme before
      // first paint (the dark-mode shim in tokens.css keys off the attribute).
      (function () {
        try {
          var pref = localStorage.getItem("aleph.theme");
          var dark =
            pref === "dark" ||
            ((pref === "system" || !pref) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* default light */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
