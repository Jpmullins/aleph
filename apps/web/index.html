<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230C0E10'/%3E%3Cg fill='none' stroke='%23D9D4C8' stroke-width='7'%3E%3Ccircle cx='50' cy='50' r='34'/%3E%3Ccircle cx='50' cy='50' r='17'/%3E%3C/g%3E%3Cline x1='29' y1='71' x2='71' y2='29' stroke='%23D9D4C8' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23D9D4C8'/%3E%3C/svg%3E" />
    <!-- No font <link> here, and no preconnect to a font CDN.
         Three tags pointing at fonts.googleapis.com stood here. Aleph deploys
         as a docker compose stack into networks that may have no outbound
         route, and a CDN font does not fail loudly — it falls back, so every
         face silently became a system font and nothing reported it. The three
         families are vendored under public/fonts and declared in
         src/styles/fonts.css. See public/fonts/README.md. WS-E3. -->
    <title>Aleph</title>
    <script>
      // Resolve the stored theme preference to an explicit data-theme before
      // first paint (the dark-mode shim in tokens.css keys off the attribute).
      (function () {
        try {
          var pref = localStorage.getItem("aleph.theme");
          var dark =
            pref === "dark" ||
            ((pref === "system" || !pref) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* default light */
        }
      })();
    </script>
  </head>
  <!-- No colour classes here. `bg-slate-50 text-slate-900` painted the page
       ground with literal light-mode values that never read a token, so the
       theme toggle flipped every variable underneath a body that ignored
       them: --surface-bg went #ffffff -> #0f0f10 while the visible
       background stayed near-white. body is styled from tokens in
       src/styles.css instead. -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
