packages:
  - "apps/web"
  # `tests/playwright` was declared here for a directory deleted in the
  # harness reset, so every documented `pnpm -C tests/playwright ...` command
  # was one that could never run. It goes back when the directory does
  # (docs/plan.md WS-UI-2 / WS-P4).

allowBuilds:
  # Telemetry postinstall — keep blocked.
  "@scarf/scarf": false

# Security overrides: force transitive deps to patched versions (Dependabot).
overrides:
  prismjs: ">=1.30.0" # GHSA-x7hr-w5r2-h6wg (DOM clobbering / XSS) — <1.30.0
  postcss: ">=8.5.10" # nested-source-map parse vuln — <8.5.10
  dompurify: ">=3.4.11 <4" # XSS via mXSS — <=3.4.10 (transitive via @a2ui/markdown-it + mermaid)
  js-yaml: ">=4.2.0 <5" # <=4.1.1 (transitive, dev-only via eslint; pin to 4.x — eslint needs the 4.x API)
