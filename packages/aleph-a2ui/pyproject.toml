[project]
name = "aleph-a2ui"
version = "0.1.0"
description = "Aleph A2UI catalog v1.0.0 — 5 surfaces + 12 inline cards."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "jsonschema>=4.25,<5",
    "aleph-core",
    "aleph-db",
    "aleph-observability",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_a2ui"]
