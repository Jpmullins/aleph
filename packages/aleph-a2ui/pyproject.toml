[project]
name = "aleph-a2ui"
version = "0.1.0"
description = "Aleph A2UI catalog v1.0.0 — 5 surfaces + 12 inline cards."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "jsonschema>=4.25,<5",
    "aleph-core",
    "aleph-db",
    "aleph-kernel",
    "aleph-observability",
    "aleph-security",
]

[project.optional-dependencies]
# A2UI-over-MCP server (`python -m aleph_a2ui.mcp_server`). Optional so core
# imports of the catalog never pull the MCP server SDK.
mcp = ["mcp>=1.28,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_a2ui"]
