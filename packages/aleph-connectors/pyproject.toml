[project]
name = "aleph-connectors"
version = "0.1.0"
description = "Aleph connector framework + plugin set. Inc 3 adds the document-output connector roster."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "pynacl==1.6.2",
    "feedparser>=6.0.10,<7",
    "aleph-core",
    "aleph-db",
    "aleph-rks",
    "aleph-security",
    "aleph-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_connectors"]
