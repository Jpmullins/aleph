[project]
name = "aleph-belief"
version = "0.1.0"
description = "Aleph web of belief — patch contract, trust tiers, and citation policy."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic==2.13.4",
    "aleph-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_belief"]
