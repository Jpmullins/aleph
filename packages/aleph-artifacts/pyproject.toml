[project]
name = "aleph-artifacts"
version = "0.1.0"
description = "Aleph artifacts — Builder agent, RenderedAssets, exporters, CSL bibliography."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "jinja2==3.1.6",
    "langgraph>=1.2,<2",
    "weasyprint==69.0",
    "citeproc-py>=0.9,<1",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-rks",
    "aleph-security",
    "aleph-wiki",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_artifacts"]
