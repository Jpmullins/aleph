[project]
name = "aleph-evals"
version = "0.1.0"
description = "Aleph eval runner. Skeleton in Inc 0; populated in Inc 8."
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.4",
    "aleph-core",
]

[project.scripts]
aleph-evals = "aleph_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_evals"]
