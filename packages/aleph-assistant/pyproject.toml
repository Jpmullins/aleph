[project]
name = "aleph-assistant"
version = "0.1.0"
description = "Aleph assistant — wiki-first retrieval router, composer, LangGraph turn workflow."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "langgraph==1.0.6",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-rks",
    "aleph-security",
    "aleph-wiki",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_assistant"]
