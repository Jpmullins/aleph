[project]
name = "aleph-models"
version = "0.1.0"
description = "LiteLLM gateway transport + ModelProfile resolver + pricing"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "orjson==3.11.9",
    "pydantic==2.13.4",
    "redis>=5,<6",
    "aleph-core",
    "aleph-db",
    "aleph-observability",
    "aleph-security",
]

[project.optional-dependencies]
# The in-process fake gateway (`aleph_models.testing.gateway`), shared by every
# package that needs to test against a badly behaved model server. Optional so
# a production install of the transport never pulls a web framework — nothing
# on a shipped code path imports `aleph_models.testing`.
testing = ["starlette>=1.3,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_models"]
