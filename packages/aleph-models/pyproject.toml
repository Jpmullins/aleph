[project]
name = "aleph-models"
version = "0.1.0"
description = "LiteLLM gateway transport + ModelProfile resolver + pricing"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "orjson==3.11.9",
    "pydantic==2.13.4",
    "redis>=5,<6",
    "aleph-core",
    "aleph-db",
    "aleph-observability",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_models"]
