[project]
name = "aleph-runtime"
version = "0.1.0"
description = "Aleph composition root — the shared capabilities every process boots."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "redis>=5,<6",
    "sqlalchemy[asyncio]==2.0.50",
    "aleph-core",
    "aleph-db",
    "aleph-kernel",
    "aleph-models",
    "aleph-observability",
    "aleph-rks",
    "aleph-scholar",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_runtime"]
