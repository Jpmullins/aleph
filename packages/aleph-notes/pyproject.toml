[project]
name = "aleph-notes"
version = "0.1.0"
description = "Aleph analyst notebook — Note + NoteSection models."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "aleph-core",
    "aleph-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_notes"]
