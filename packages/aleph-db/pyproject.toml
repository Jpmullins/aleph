[project]
name = "aleph-db"
version = "0.1.0"
description = "Aleph SQLAlchemy ORM, repositories, and Alembic migrations"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "aleph-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_db"]
