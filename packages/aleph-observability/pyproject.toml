[project]
name = "aleph-observability"
version = "0.1.0"
description = "OTEL + Langfuse + structlog wiring"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-exporter-prometheus==0.63b1",
    "langfuse==4.6.1",
    "structlog==25.5.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_observability"]
