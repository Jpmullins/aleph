[project]
name = "aleph-rks"
version = "0.1.0"
description = "Aleph Raw Knowledge Store — sources, assets, normalization, chunking, embedding"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pgvector>=0.4.0,<1",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "minio==7.2.20",
    # Normalization deps
    "pypdf>=6.10.2",
    "pdfminer.six==20260107",
    "python-docx==1.2.0",
    "readability-lxml==0.8.4.1",
    "lxml==6.1.0",
    "beautifulsoup4==4.13.5",
    "ebooklib==0.19",
    "markdown-it-py==4.0.0",
    "tiktoken>=0.10,<1",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-security",
]

[project.optional-dependencies]
# Layout-aware PDF reading. WS-RS11.
#
# An EXTRA, not a dependency, and the reason is in
# `docs/measurements/pdf-parsers.md`: docling pulls a model stack on the order
# of a gigabyte and downloads weights on first use. Aleph's shipped parsers
# extract the words and none of the structure — a median of one or two headings
# across a whole paper and zero tables, so every PDF chunk carries
# `section_path = NULL` by construction — but that is a capped feature, not a
# broken install, and forcing a gigabyte on someone who ingests HTML would be
# the wrong default.
#
# `uv sync --all-extras` (what CI and `./scripts/bootstrap-local.sh` run) picks
# it up. A deployment that does not want it keeps the flat parsers and is told
# so by the normalizer registry rather than by a stack trace.
pdf-layout = [
    "docling>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_rks"]
