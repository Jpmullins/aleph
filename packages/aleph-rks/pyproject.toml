[project]
name = "aleph-rks"
version = "0.1.0"
description = "Aleph Raw Knowledge Store — sources, assets, normalization, chunking, embedding"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pgvector>=0.4.0,<1",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "minio==7.2.20",
    # Normalization deps
    "pypdf>=6.10.2",
    "pdfminer.six==20250506",
    "python-docx==1.2.0",
    "readability-lxml==0.8.4.1",
    "lxml==6.1.0",
    "beautifulsoup4==4.13.5",
    "ebooklib==0.19",
    "markdown-it-py==4.0.0",
    "tiktoken>=0.10,<1",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_rks"]
