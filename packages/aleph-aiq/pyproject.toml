[project]
name = "aleph-aiq"
version = "0.1.0"
description = "Aleph integration with NVIDIA AIQ (research subsystem)."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-jose[cryptography]==3.5.0",
    "aleph-core",
    "aleph-db",
    "aleph-connectors",
    "aleph-models",
    "aleph-observability",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_aiq"]
