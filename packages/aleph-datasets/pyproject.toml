[project]
name = "aleph-datasets"
version = "0.1.0"
description = "Aleph datasets — Dataset / DatasetVersion / Observation with chart bindings."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "aleph-core",
    "aleph-db",
    "aleph-rks",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_datasets"]
