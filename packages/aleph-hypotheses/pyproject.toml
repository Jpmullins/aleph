[project]
name = "aleph-hypotheses"
version = "0.1.0"
description = "Aleph hypotheses — first-class structured analyst questions."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "aleph-core",
    "aleph-db",
    # The provenance lattice `confidence.TIER_WEIGHTS` scores. `aleph-belief`
    # is a leaf over `aleph-core` only, so this adds no cycle.
    "aleph-belief",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_hypotheses"]
