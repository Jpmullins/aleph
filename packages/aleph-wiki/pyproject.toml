[project]
name = "aleph-wiki"
version = "0.1.0"
description = "Aleph wiki — pages, revisions, claims, citations, source pages, aliases, hand-edits, rejection feedback, and the wiki ingest agent."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "pydantic==2.13.4",
    "langgraph>=1.2,<2",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-rks",
    "aleph-hypotheses",
    "aleph-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_wiki"]
