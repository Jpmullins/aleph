[project]
name = "aleph-kernel"
version = "0.1.0"
description = "Aleph kernel — revertible effects, declared capabilities, computed blast radius."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aleph-core",
    "aleph-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_kernel"]
