[project]
name = "aleph-security"
version = "0.1.0"
description = "Aleph auth, JWT verify, Principal, role gates, agent tokens"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyjwt[crypto]>=2.10.1",
    "cryptography==48.0.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "aleph-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_security"]
