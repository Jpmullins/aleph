[project]
name = "aleph-research"
version = "0.1.0"
description = "Native research loop: plan/search/ingest/reflect/compose over the typed connector suite, landing reports via the wiki synthesis workflow."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy[asyncio]==2.0.50",
    "structlog==25.5.0",
    "langgraph>=1.2,<2",
    "aleph-core",
    "aleph-db",
    "aleph-models",
    "aleph-observability",
    "aleph-security",
    "aleph-connectors",
    "aleph-scholar",
    "aleph-rks",
    "aleph-wiki",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_research"]
