- id: route-reachability
  intent: "Every client route resolves to a real component reachable from a UI entry point; API routers all mount; orphan endpoints are flagged."
  evidence:
    - apps/web/src/App.tsx
    - apps/api/src/aleph_api/main.py
  check_type: route
  status: unverified
  wired: true
  notes: "Assert App.tsx's 4 routes map to components and the workspace route is reachable via ProjectList navigation; assert all main.py routers import; flag evals/merge-proposals/reviews-trigger/datasets as UI-orphan endpoints."

- id: web-typecheck
  intent: "The web app typechecks cleanly (tsc --noEmit), i.e. no unresolved imports or type errors in the UI."
  evidence:
    - apps/web/tsconfig.json
    - apps/web/package.json
  check_type: static
  status: unverified
  wired: true
  notes: "pnpm -C apps/web typecheck exits 0."

- id: api-imports-resolve
  intent: "The API app factory and its routers import cleanly (no unresolved imports / broken modules)."
  evidence:
    - apps/api/src/aleph_api/main.py
  check_type: static
  status: unverified
  wired: true
  notes: "Importing aleph_api.main and calling create_app() succeeds (executed inside the running api container)."
