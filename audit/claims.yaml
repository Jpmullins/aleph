# Aleph intent claims — one per intended user-facing capability.
# status is always `unverified` here; audit/run.sh + audit/checks/ set pass/fail.
# `wired` is the auditor's judgment (is the feature connected end-to-end?).
# check_type ∈ {e2e, http, route, dataflow, build, static}.

- id: projects-list
  intent: "The landing page lists the user's projects (and shows an empty state when there are none), each openable."
  evidence:
    - apps/web/src/components/ProjectList.tsx
    - apps/web/src/App.tsx
    - apps/api/src/aleph_api/routes/projects.py
  check_type: e2e
  status: unverified
  wired: true
  notes: "GET /v1/projects backs the list; clicking a project navigates to /projects/:id."

- id: project-create
  intent: "A user can create a new project from the UI and land in its 3-panel workspace."
  evidence:
    - apps/web/src/components/ProjectList.tsx
    - apps/api/src/aleph_api/routes/projects.py
    - apps/web/src/components/ProjectWorkspace.tsx
  check_type: e2e
  status: unverified
  wired: true
  notes: "POST /v1/projects (title, description, model_profile_name) → 201; UI routes to workspace."

- id: project-soft-delete
  intent: "A project can be soft-deleted (status=deleted) and disappears from the active list."
  evidence:
    - apps/api/src/aleph_api/routes/projects.py
    - apps/web/src/components/ProjectList.tsx
  check_type: dataflow
  status: unverified
  wired: true
  notes: "PATCH /v1/projects/{id} {status:deleted}; subsequent GET list must not contain it."

- id: workspace-three-panel-shell
  intent: "Opening a project shows the 3-panel shell: left rail (sessions/drawers), center chat+activity, right 5 surface tabs."
  evidence:
    - apps/web/src/components/ProjectWorkspace.tsx
    - apps/web/src/components/LeftPanel.tsx
    - apps/web/src/components/A2UIRightPanel.tsx
  check_type: e2e
  status: unverified
  wired: true
  notes: "Panels + the 5 tab labels (Wiki/Library/Notes/Hypotheses/Briefs) must be visible."

- id: session-create
  intent: "The '+ New' button creates a chat session and enables the chat composer."
  evidence:
    - apps/web/src/components/LeftPanel.tsx
    - apps/api/src/aleph_api/routes/assistant.py
  check_type: e2e
  status: unverified
  wired: true
  notes: "POST /v1/projects/{id}/sessions; composer (copilot-chat-textarea) becomes enabled."

- id: chat-streams-response
  intent: "A user can send a chat message to the Live agent and receive a streamed assistant response in the transcript."
  evidence:
    - apps/web/src/components/CopilotChatSurface.tsx
    - apps/web/src/lib/copilot.tsx
    - apps/copilot-runtime/src/server.ts
    - apps/api/src/aleph_api/copilot_agent.py
  check_type: e2e
  status: unverified
  wired: true
  notes: "Browser→runtime(:4000)→API /copilotkit/agent/assistant→Deep-Agents orchestrator. Assert an assistant message with non-empty text appears."

- id: copilot-runtime-agent-wired
  intent: "The Node CopilotRuntime exposes the 'assistant' agent with A2UI enabled, and the API AG-UI endpoint exists."
  evidence:
    - apps/copilot-runtime/src/server.ts
    - apps/api/src/aleph_api/copilotkit_endpoint.py
    - apps/api/src/aleph_api/lifespan.py
  check_type: http
  status: unverified
  wired: true
  notes: "GET :4000/api/copilotkit/info → agents.assistant + a2uiEnabled; API /copilotkit/agent/assistant responds (405/422 = mounted)."

- id: wiki-first-retrieval
