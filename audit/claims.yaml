  check_type: dataflow
  status: unverified
  wired: true
  notes: "POST /cards/actions {approve, target=synthesis_proposal} → proposal status approved + ledger event count increases."

- id: research-to-wiki
  intent: "Native research produces a committed wiki page linked to a synthesis proposal and an agent run, ingesting sources through the typed connectors (research → wiki)."
  evidence:
    - packages/aleph-research/src/aleph_research/research_workflow.py
    - apps/workers/src/aleph_workers/jobs/research.py
    - packages/aleph-wiki/src/aleph_wiki/synthesis_workflow.py
  check_type: dataflow
  status: unverified
  wired: true
  notes: "Over existing real data: each synthesis-proposal references a real page_id (a committed wiki page) + agent_run_id, and the project holds research-ingested sources with connector_kind != upload. Non-destructive proof the pipeline ran end-to-end."

- id: bootstrap-on-create
  intent: "Creating a project auto-bootstraps a wiki: a bootstrap agent run seeds an overview page."
  evidence:
    - apps/api/src/aleph_api/routes/projects.py
    - apps/workers/src/aleph_workers/jobs/bootstrap.py
  check_type: dataflow
  status: unverified
  wired: true
  notes: "Create a project with a real title/description; poll /agent-runs for a bootstrap run reaching terminal + an overview wiki page. Gated by bootstrap_auto_enabled (enabled in this stack)."

- id: artifacts-build
  intent: "A user/agent can build an artifact (e.g. markdown bundle) from wiki pages and download the rendered asset."
  evidence:
    - apps/web/src/a2ui/components/ArtifactsSurface.tsx
    - apps/api/src/aleph_api/routes/artifacts.py
    - apps/workers/src/aleph_workers/jobs
  check_type: dataflow
  status: unverified
  wired: false
  notes: "BUILD is wired (builder agent succeeds, artifact + version created) but DOWNLOAD is not: the UI's Download button (ArtifactsSurface.tsx:266) links to /artifacts/{id}/versions/{ver}/download, which is NOT a registered route (artifacts.py has no download endpoint) → 404. Broken end-to-end at the download step."

