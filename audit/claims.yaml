    - apps/workers/src/aleph_workers/jobs/wiki_ingest.py
  check_type: dataflow
  status: unverified
  wired: true
  notes: "POST /sources/upload; poll /agent-runs until normalize/wiki reach a terminal state; assert source status advances past 'normalized'."

